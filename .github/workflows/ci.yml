name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: agentrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest test_agent_relay.py -v

      - name: Run integration tests against PostgreSQL
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/agentrelay
        run: |
          PYTHONUNBUFFERED=1 uv run uvicorn main:app --port 8000 > server.log 2>&1 &
          for i in {1..15}; do curl -s http://127.0.0.1:8000/ready && break || sleep 1; done
          cat server.log
          uv run pytest test_scenario1_integration.py -v -s

  deploy:
    name: Build & Deploy to Kind
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agent-relay:${{ github.sha }} .

      - name: Create k8s Kind Cluster
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl || mv ./kubectl /usr/local/bin/kubectl
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind || mv ./kind /usr/local/bin/kind
          kind delete cluster --name agent-relay || true
          kind create cluster --name agent-relay

      - name: Load image into Kind
        run: kind load docker-image agent-relay:${{ github.sha }} --name agent-relay

      - name: Deploy to Kind
        run: |
          # Inject the unique tag into the manifest
          sed -i "s/agent-relay:local/agent-relay:${{ github.sha }}/g" k8s/api.yaml
          kubectl apply -f k8s/
          kubectl wait --for=condition=ready pod -l app=postgres --timeout=120s || kubectl rollout status statefulset/postgres --timeout=120s
          kubectl rollout status deployment/agent-relay-api --timeout=120s
          kubectl get pods,svc,pvc
